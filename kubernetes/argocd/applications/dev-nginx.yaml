apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-nginx
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/wawangholanda/platform-engineering-lab.git
    targetRevision: main
    path: environments/dev/kubernetes/apps/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
