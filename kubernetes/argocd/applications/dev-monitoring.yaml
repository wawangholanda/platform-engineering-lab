apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/wawangholanda/platform-engineering-lab.git
    targetRevision: main
    path: environments/dev/kubernetes/monitoring/kube-prometheus-stack
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
