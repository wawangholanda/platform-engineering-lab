apiVersion: v1
kind: Pod
metadata:
  name: nfs-test-pod-2
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker01

  containers:
    - name: nginx
      image: nginx:1.27
      command:
        - sleep
        - "3600"
      volumeMounts:
        - name: nfs-storage
          mountPath: /data

  volumes:
    - name: nfs-storage
      persistentVolumeClaim:
        claimName: nfs-test-pvc
