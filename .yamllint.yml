---
extends: default

rules:
  comments:
    min-spaces-from-content: 1

  comments-indentation: false

  braces:
    max-spaces-inside: 1

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: false

  line-length:
    max: 150

  document-start:
    present: true
