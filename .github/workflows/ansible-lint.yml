---
name: Ansible Lint

# on:
#   pull_request:
#     paths:
#       - "ansible/**"

"on":
  workflow_dispatch:

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - name: Install ansible-lint
        run: |
          pip install ansible-lint


      - name: Run ansible lint
        run: |
          ansible-lint ansible/
