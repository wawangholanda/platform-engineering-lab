---
name: Helm Lint

# on:
#   pull_request:
#     paths:
#       - "helm/**"

"on":
  workflow_dispatch:

jobs:

  helm:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - uses: azure/setup-helm@v4


      - name: Helm lint
        run: |
          helm lint helm/charts/*
