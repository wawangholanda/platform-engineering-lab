---
- name: Configure Tailscale gateway host
  hosts: proxmox
  become: true
  gather_facts: false

  roles:
    - role: tailscale_gateway
      tags:
        - tailscale_gateway
        - tailscale_gateway_host

- name: Configure Tailscale gateway guest
  hosts: tailscale_gateway
  become: true
  gather_facts: false

  roles:
    - role: tailscale_gateway
      tags:
        - tailscale_gateway
        - tailscale_gateway_guest

- name: Reconcile Tailscale authentication state
  hosts: proxmox
  become: true
  gather_facts: false
  tags:
    - tailscale_gateway_reconcile

  vars:
    tailscale_gateway_vmid: 110
    tailscale_gateway_local_state: "{{ playbook_dir }}/../../.secrets/tailscale/tailscaled.state"
    tailscale_gateway_proxmox_state_dir: /var/lib/tailscale-gateway
    tailscale_gateway_proxmox_state_path: "{{ tailscale_gateway_proxmox_state_dir }}/tailscaled.state"
    tailscale_gateway_require_online: true

  tasks:
    - name: Include Tailscale state reconciliation tasks
      ansible.builtin.include_tasks:
        file: ../roles/tailscale_gateway/tasks/reconcile.yml
        apply:
          tags:
            - tailscale_gateway_reconcile
      tags:
        - tailscale_gateway_reconcile

- name: Backup Tailscale gateway state
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    tailscale_gateway_local_state: "{{ playbook_dir }}/../../.secrets/tailscale/tailscaled.state"
  tags:
    - tailscale_gateway_backup

  tasks:
    - name: Check local Tailscale recovery state
      ansible.builtin.stat:
        path: "{{ tailscale_gateway_local_state }}"
      delegate_to: localhost
      become: false
      register: tailscale_gateway_local_backup_check

    - name: Validate local Tailscale recovery state
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import os
            import stat
            import sys

            path = sys.argv[1]
            try:
                metadata = os.lstat(path)
            except OSError:
                sys.exit(1)

            if not stat.S_ISREG(metadata.st_mode) or metadata.st_size == 0:
                sys.exit(1)

            try:
                with open(path, "r", encoding="utf-8") as state_file:
                    data = json.load(state_file)
            except (OSError, UnicodeError, ValueError):
                sys.exit(1)

            sys.exit(0 if isinstance(data, dict) and bool(data) else 1)
          - "{{ tailscale_gateway_local_state }}"
      delegate_to: localhost
      become: false
      register: tailscale_gateway_local_backup_validation
      changed_when: false
      failed_when: false
      when:
        - tailscale_gateway_local_backup_check.stat.exists
        - (tailscale_gateway_local_backup_check.stat.size | default(0) | int) > 0

    - name: Include Tailscale gateway backup tasks
      ansible.builtin.include_tasks:
        file: ../roles/tailscale_gateway/tasks/backup.yml
      vars:
        tailscale_gateway_vmid: 110
      when: >-
        not tailscale_gateway_local_backup_check.stat.exists
        or (tailscale_gateway_local_backup_check.stat.size | default(0) | int) == 0
        or (tailscale_gateway_local_backup_validation.rc | default(1) | int) != 0

    - name: Refresh missing or invalid local Tailscale recovery state
      when: >-
        not tailscale_gateway_local_backup_check.stat.exists
        or (tailscale_gateway_local_backup_check.stat.size | default(0) | int) == 0
        or (tailscale_gateway_local_backup_validation.rc | default(1) | int) != 0
      block:
        - name: Ensure local Tailscale recovery directory exists
          ansible.builtin.file:
            path: "{{ tailscale_gateway_local_state | dirname }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        - name: Fetch Tailscale state to temporary local recovery file
          ansible.builtin.fetch:
            src: /var/lib/tailscale-gateway/tailscaled.state
            dest: "{{ tailscale_gateway_local_state }}.tmp"
            flat: true

        - name: Validate fetched temporary Tailscale state
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json
                import os
                import stat
                import sys

                path = sys.argv[1]
                try:
                    metadata = os.lstat(path)
                except OSError:
                    sys.exit(1)

                if not stat.S_ISREG(metadata.st_mode) or metadata.st_size == 0:
                    sys.exit(1)

                try:
                    with open(path, "r", encoding="utf-8") as state_file:
                        data = json.load(state_file)
                except (OSError, UnicodeError, ValueError):
                    sys.exit(1)

                sys.exit(0 if isinstance(data, dict) and bool(data) else 1)
              - "{{ tailscale_gateway_local_state }}.tmp"
          delegate_to: localhost
          become: false
          register: tailscale_gateway_fetched_state_validation
          changed_when: false

        - name: Promote validated Tailscale state to local recovery storage
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import fcntl
                import json
                import os
                import stat
                import sys

                temporary, destination = sys.argv[1:3]
                lock_fd = os.open(
                    destination + ".lock", os.O_CREAT | os.O_RDWR, 0o600
                )
                try:
                    fcntl.flock(lock_fd, fcntl.LOCK_EX)

                    def load_valid_state(file_path):
                        try:
                            metadata = os.lstat(file_path)
                        except FileNotFoundError:
                            return None

                        if (
                            not stat.S_ISREG(metadata.st_mode)
                            or metadata.st_size == 0
                        ):
                            return None

                        try:
                            with open(
                                file_path, "r", encoding="utf-8"
                            ) as stream:
                                data = json.load(stream)
                        except FileNotFoundError:
                            return None
                        except (UnicodeError, ValueError):
                            return None

                        return (
                            data
                            if isinstance(data, dict) and bool(data)
                            else None
                        )

                    if load_valid_state(destination) is not None:
                        try:
                            os.unlink(temporary)
                        except FileNotFoundError:
                            pass
                        print("Existing valid recovery state preserved.")
                    else:
                        if load_valid_state(temporary) is None:
                            raise ValueError(
                                "Temporary recovery state is missing or invalid."
                            )
                        os.chmod(temporary, 0o600)
                        os.replace(temporary, destination)
                        print("Recovery state promoted.")
                finally:
                    os.close(lock_fd)
              - "{{ tailscale_gateway_local_state }}.tmp"
              - "{{ tailscale_gateway_local_state }}"
          delegate_to: localhost
          become: false
          register: tailscale_gateway_state_promotion
          changed_when: "'Recovery state promoted.' in tailscale_gateway_state_promotion.stdout"

      always:
        - name: Remove temporary local recovery state after attempt
          ansible.builtin.file:
            path: "{{ tailscale_gateway_local_state }}.tmp"
            state: absent
          delegate_to: localhost
          become: false
