---
kubernetes_version: "1.34"

kubernetes_repo_version: "v1.34"

pod_cidr: "10.0.0.0/16"

control_plane_endpoint: "192.168.1.30:6443"

cilium_version: "1.20.0"

helm_version: "v3.21.4"

argocd_chart_version: "10.4.0"

kube_prometheus_stack_chart_version: "88.5.0"

# =========================================================
# GitOps
# =========================================================

gitops_repo_url: "https://github.com/wawangholanda/platform-engineering-lab.git"
gitops_target_revision: "main"

gitops_applications:
  - name: dev-nginx
    type: git
    path: "environments/dev/kubernetes/apps/nginx"
    namespace: demo

  - name: dev-monitoring
    type: helm
    chart: kube-prometheus-stack
    chart_version: "88.5.0"
    helm_repo_url: "https://prometheus-community.github.io/helm-charts"
    values_path: "environments/dev/kubernetes/monitoring/kube-prometheus-stack/values.yaml"
    namespace: monitoring
