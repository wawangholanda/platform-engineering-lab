---
# =========================================================
# Worker Join
# =========================================================

- name: Check whether worker has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_worker_worker_joined


# =========================================================
# Generate Join Command
# =========================================================

- name: Generate kubeadm join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: k8s_worker_kubeadm_join_command
  changed_when: false
  when: not k8s_worker_worker_joined.stat.exists


# =========================================================
# Join Worker
# =========================================================

- name: Join worker to Kubernetes cluster  # noqa no-changed-when
  ansible.builtin.command:
    cmd: "{{ k8s_worker_kubeadm_join_command.stdout }}"
  when:
    - not k8s_worker_worker_joined.stat.exists
    - k8s_worker_kubeadm_join_command.stdout is defined
