---
# =========================================================
# Kubernetes kubeconfig
# =========================================================

- name: Check Kubernetes admin kubeconfig
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kube_admin_config

- name: Fail when Kubernetes admin kubeconfig is missing
  ansible.builtin.fail:
    msg: >
      /etc/kubernetes/admin.conf was not found.
      The Kubernetes control plane must be initialized before
      installing the NFS CSI driver.
  when: not kube_admin_config.stat.exists


# =========================================================
# Ansible Kubernetes Python dependencies
# =========================================================

- name: Install Python Kubernetes client
  ansible.builtin.apt:
    name:
      - python3-kubernetes
    state: present
    update_cache: true
    cache_valid_time: 3600


# =========================================================
# NFS CSI Driver
# =========================================================

- name: Add NFS CSI Helm repository
  kubernetes.core.helm_repository:
    name: csi-driver-nfs
    repo_url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts

- name: Install NFS CSI Driver
  kubernetes.core.helm:
    name: csi-driver-nfs
    chart_ref: csi-driver-nfs/csi-driver-nfs
    release_namespace: kube-system
    create_namespace: false
    state: present
    wait: true
    kubeconfig: /etc/kubernetes/admin.conf


# =========================================================
# StorageClass
# =========================================================

- name: Create NFS StorageClass
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: nfs
      provisioner: nfs.csi.k8s.io
      parameters:
        server: 192.168.1.27
        share: /srv/nfs/kubernetes
        reclaimPolicy: Delete
        archiveOnDelete: "true"
      mountOptions:
        - nfsvers=4.1
      volumeBindingMode: Immediate
