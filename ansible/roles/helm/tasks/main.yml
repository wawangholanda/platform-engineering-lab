---
# =========================================================
# Helm
# =========================================================

- name: Check installed Helm binary
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary


- name: Check installed Helm version
  ansible.builtin.command:
    cmd: /usr/local/bin/helm version --short
  register: helm_current_version
  changed_when: false
  failed_when: false
  when: helm_binary.stat.exists


- name: Determine whether Helm installation is required
  ansible.builtin.set_fact:
    helm_install_required: >-
      {{
        not helm_binary.stat.exists
        or helm_current_version.rc != 0
        or helm_version not in helm_current_version.stdout
      }}


# =========================================================
# Download
# =========================================================

- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    mode: "0644"
  when: helm_install_required


# =========================================================
# Extract
# =========================================================

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/linux-amd64/helm"
  when:
    - helm_install_required
    - not ansible_check_mode


# =========================================================
# Install
# =========================================================

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when:
    - helm_install_required
    - not ansible_check_mode


# =========================================================
# Cleanup
# =========================================================

- name: Remove extracted Helm directory
  ansible.builtin.file:
    path: /tmp/linux-amd64
    state: absent
  when:
    - helm_install_required
    - not ansible_check_mode


- name: Remove Helm archive
  ansible.builtin.file:
    path: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    state: absent
  when:
    - helm_install_required
    - not ansible_check_mode
