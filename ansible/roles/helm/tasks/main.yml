---
# =========================================================
# Helm
# =========================================================

- name: Check installed Helm version
  ansible.builtin.command:
    cmd: /usr/local/bin/helm version --short
  register: helm_current_version
  changed_when: false
  failed_when: false


- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    mode: "0644"
  when:
    - helm_current_version.rc != 0
      or helm_version not in helm_current_version.stdout


- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when:
    - helm_current_version.rc != 0
      or helm_version not in helm_current_version.stdout


- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when:
    - helm_current_version.rc != 0
      or helm_version not in helm_current_version.stdout


- name: Verify Helm installation
  ansible.builtin.command:
    cmd: /usr/local/bin/helm version --short
  register: helm_installed_version
  changed_when: false
