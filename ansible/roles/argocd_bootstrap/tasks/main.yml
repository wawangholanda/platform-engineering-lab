---
# =========================================================
# Argo CD GitOps Bootstrap
# =========================================================

- name: Create Git-based Argo CD Applications
  kubernetes.core.k8s:
    state: present
    kubeconfig: /home/ubuntu/.kube/config
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: "{{ item.name }}"
        namespace: argocd
      spec:
        project: default

        source:
          repoURL: "{{ gitops_repo_url }}"
          targetRevision: "{{ gitops_target_revision }}"
          path: "{{ item.path }}"

        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ item.namespace }}"

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
  loop: "{{ gitops_applications }}"
  when: item.type == "git"


- name: Create Helm-based Argo CD Applications
  kubernetes.core.k8s:
    state: present
    kubeconfig: /home/ubuntu/.kube/config
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: "{{ item.name }}"
        namespace: argocd
      spec:
        project: default

        sources:
          - repoURL: "{{ item.helm_repo_url }}"
            chart: "{{ item.chart }}"
            targetRevision: "{{ item.chart_version }}"
            helm:
              valueFiles:
                - "$values/{{ item.values_path }}"

          - repoURL: "{{ gitops_repo_url }}"
            targetRevision: "{{ gitops_target_revision }}"
            ref: values

        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ item.namespace }}"

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
  loop: "{{ gitops_applications }}"
  when: item.type == "helm"


# =========================================================
# Wait for Git-based Argo CD Applications
# =========================================================

- name: Wait for Git-based Argo CD Applications to become Synced and Healthy
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: "{{ item.name }}"
    kubeconfig: /home/ubuntu/.kube/config
  register: git_application_status
  until:
    - git_application_status.resources | length > 0
    - git_application_status.resources[0].status.sync.status | default('') == 'Synced'
    - git_application_status.resources[0].status.health.status | default('') == 'Healthy'
  retries: 60
  delay: 10
  loop: "{{ gitops_applications }}"
  when: item.type == "git"


# =========================================================
# Wait for Helm-based Argo CD Applications
# =========================================================

- name: Wait for Helm-based Argo CD Applications to become Synced and Healthy
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: "{{ item.name }}"
    kubeconfig: /home/ubuntu/.kube/config
  register: helm_application_status
  until:
    - helm_application_status.resources | length > 0
    - helm_application_status.resources[0].status.sync.status | default('') == 'Synced'
    - helm_application_status.resources[0].status.health.status | default('') == 'Healthy'
  retries: 60
  delay: 10
  loop: "{{ gitops_applications }}"
  when: item.type == "helm"
